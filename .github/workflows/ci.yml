# Repository checks, and the preview deploy that depends on them.
#
# The deploy lives here rather than in its own workflow because `needs:` between
# jobs is the only dependency GitHub actually enforces. As two workflows they
# raced, and a commit that failed CI still reached the preview URL.

name: CI

on:
  # Every branch, because work here is pushed straight to feature branches as
  # often as through a PR, and main itself is only built - never tested - by the
  # deploy workflow.
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This name is the required status check on main. Renaming the job silently
    # disables branch protection, which keeps passing because nothing reports.
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # An accessibility rule no test covers: the component tests would pass
      # just as happily with h-2. Grep-based, so it guards the class strings
      # only - see the script header for what it cannot see.
      - name: Check tap targets
        run: bun run check:tap-targets

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Storybook imports the components directly, so a rename or a changed prop
      # breaks it without touching the app build. Nothing else catches that.
      - name: Build Storybook
        run: bun run build:storybook

  deploy-preview:
    name: Deploy portfolio-web to Vercel Preview
    runs-on: ubuntu-latest
    needs: checks
    # Same scope the standalone staging workflow had: the active feature branch,
    # any PR into main, or a manual run. Other branches get checks only.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/feat/portfolio-platform-2026'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel preview environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build portfolio-web locally
        run: bun run build:portfolio

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
