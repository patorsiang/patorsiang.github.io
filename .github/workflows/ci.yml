# Repository checks. The other three workflows all deploy; this one is the only
# gate that runs before code lands, so it owns formatting, linting, types, tests,
# and a full build of both apps.

name: CI

on:
  # Every branch, because work here is pushed straight to feature branches as
  # often as through a PR, and main itself is only built - never tested - by the
  # deploy workflow.
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
